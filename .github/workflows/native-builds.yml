name: Build native test apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - run: npm test --prefix mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-Eye-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm run sync --prefix mobile
      - run: npm test --prefix mobile
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile
      - run: ditto -c -k --sequesterRsrc --keepParent mobile/build-ios/Build/Products/Debug-iphonesimulator/App.app Crystal-Eye-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Crystal-Eye-iOS-Simulator
          path: Crystal-Eye-iOS-Simulator.zip
